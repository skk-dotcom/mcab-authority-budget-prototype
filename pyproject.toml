[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcab-authority-budget-prototype"
version = "0.1.0"
description = "Synthetic evaluation harness separating cumulative state, entity calibration, and authority-budget tightening"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "MCAB prototype contributors"}]
dependencies = [
  "pandas==3.0.5",
  "matplotlib==3.11.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
mcab-demo = "mcab_prototype.run_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
